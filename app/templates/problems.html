{% extends "base.html" %}
{% block title %}Problems - LC Trainer{% endblock %}
{% block content %}
  <section class="fetch-problem">
    <h2>Fetch from LeetCode</h2>
    <form method="post" action="/problems/fetch" class="form-grid">
      <input name="url" placeholder="https://leetcode.com/problems/two-sum/" required>
      <button type="submit">fetch + add</button>
    </form>
  </section>

  <section class="add-problem">
    <h2>Add Problem Manually</h2>
    <form method="post" action="/problems" class="form-grid">
      <input name="title" placeholder="Title (e.g. Two Sum)" required>
      <input name="url" placeholder="Link (algo.monster / leetcode)">
      <select name="difficulty">
        <option>Easy</option>
        <option selected>Medium</option>
        <option>Hard</option>
      </select>
      <input name="topic" placeholder="Topic (e.g. Two Pointers)">
      <textarea name="notes" placeholder="Notes / problem description"></textarea>
      <button type="submit">Add</button>
    </form>
  </section>

  {% include "_problem_table.html" %}
{% endblock %}
